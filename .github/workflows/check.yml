# Manual trigger only: hosted runs cost money or goodwill and are started by a person.
# Runs the deterministic half with no model, no browser and no Java.
name: check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m storecheck self-test
      - run: python3 -m unittest -v
      - name: corpus fetch, then verify twice from cache (a page with a changing body would fail here)
        run: |
          python3 -m storecheck corpus fetch
          python3 -m storecheck corpus verify
      - name: audit the sample app and check its grid and page
        run: |
          python3 -m storecheck audit tests/fixtures/sample-app --offline --as-of 2026-09-06
          python3 -m storecheck check tests/fixtures/sample-app
