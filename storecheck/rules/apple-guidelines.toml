# Apple App Review Guidelines, section by section. Each rule names the section
# record it rests on. Reference-only sections have no rule; they are still in
# the corpus so the adversarial pass can show they were read.

[[rule]]
id = "apple.1.1.no-objectionable-or-fake-features"
store = "both"
title = "No objectionable content, and no fake or joke features such as a fake location tracker"
corpus = ["apple.arg.1.1", "google.illegal-activities", "google.child-endangerment"]
consumes = ["listing.text", "ios.built.info"]
kind = "judgement"
question = "From the listing, the screenshots and the app's own strings: is anything offensive, discriminatory, violent, sexual or inflammatory? Does any feature fake device data or pretend to do something it does not, such as a location tracker that does not track? Name what you looked at."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.1.2.user-content-moderation"
store = "both"
title = "If users can post content or interact, the app can filter, report, block, and shows contact details"
corpus = ["apple.arg.1.2", "google.user-generated-content"]
consumes = ["listing.text"]
kind = "judgement"
question = "Does the app let users post content that other users see, or talk to strangers? If not, answer N/A and say why. If so: can objectionable posts be filtered, can users report content and get a response, can users block others, and are contact details published? Name the screens."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(chat|post|comment|share with|community|feed|friends|social|profile picture|message)"]
severity = "fail"

[[rule]]
id = "apple.1.3.kids-category"
store = "apple"
title = "A Kids Category app has a parental gate, no third-party analytics or ads, and sends no identifying data to third parties"
corpus = ["apple.arg.1.3"]
consumes = ["listing.text", "ios.built.references", "ios.built.privacy_manifests"]
kind = "judgement"
question = "Only for an app in the Kids Category: are outbound links, purchases and distractions behind a parental gate? Do the bundled SDKs include analytics or advertising? Does any manifest declare device or personal data sent to a third party?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["audience:children"]
severity = "fail"

[[rule]]
id = "apple.1.5.support-url-reachable"
store = "both"
title = "The support link opens a real page with a way to contact the developer"
corpus = ["apple.arg.1.5"]
consumes = ["listing.text", "listing.support_page"]
kind = "mechanical"
check = "support_url_reachable"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.1.6.transport-security-not-disabled"
store = "apple"
title = "App Transport Security is not switched off wholesale"
corpus = ["apple.arg.1.6"]
consumes = ["ios.built.info"]
kind = "mechanical"
check = "ats_not_disabled"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "risk"

[[rule]]
id = "apple.2.1.no-placeholder-text"
store = "both"
title = "No placeholder or temporary text anywhere in the listing"
corpus = ["apple.arg.2.1"]
consumes = ["listing.text"]
kind = "mechanical"
check = "listing_no_placeholders"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.2.1.demo-account-for-login"
store = "apple"
title = "An app with a login gives the reviewer a working demo account or an approved demo mode"
corpus = ["apple.arg.2.1"]
consumes = ["console.apple.state", "ios.built.references"]
kind = "judgement"
question = "The app has a login. Do the review notes in App Store Connect carry a demo account that works today, or a demo mode Apple approved? Name where it is written and confirm the backend answers."
stages = ["in-review", "public"]
applies_when = ["signal:login"]
severity = "fail"

[[rule]]
id = "apple.2.4.no-forced-settings-changes"
store = "both"
title = "The app never tells people to restart the device or change unrelated system settings"
corpus = ["apple.arg.2.4", "google.deceptive-behavior"]
consumes = ["ios.built.info", "listing.text"]
kind = "judgement"
question = "From the app's strings and screens: does it ever ask the user to restart the phone, turn off Wi-Fi, disable a security feature, or change a system setting unrelated to its own feature? Asking to allow its own permission is fine. Name the strings you read."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.2.4.background-power"
store = "apple"
title = "Background work is limited to the declared feature and does not drain the battery"
corpus = ["apple.arg.2.4"]
consumes = ["ios.built.info", "ios.built.references"]
kind = "judgement"
question = "The app declares background modes. Does the background work stay within the declared feature, with location updates or fetches paced so the battery is not drained? Cite the mode and what the code does with it."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["background_mode:location", "background_mode:audio", "background_mode:fetch", "background_mode:processing"]
severity = "risk"

[[rule]]
id = "apple.3.1.1.digital-unlocks-use-in-app-purchase"
store = "apple"
title = "Anything unlocked inside the app is sold through in-app purchase, with restore and no expiry"
corpus = ["apple.arg.3.1.1", "apple.arg.3.1.3"]
consumes = ["ios.built.references", "listing.text"]
kind = "judgement"
question = "The app sells or unlocks something. Is every in-app unlock sold through StoreKit in-app purchase rather than a code, key, wallet or link out? Is there a restore mechanism? Do purchased credits never expire? Does the app avoid steering users to buy elsewhere? Name what you looked at."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:purchases", "listing:\\b(premium|subscri|unlock|pro version|in-app purchase|buy)"]
severity = "fail"

[[rule]]
id = "apple.3.1.2.subscription-terms-clear"
store = "apple"
title = "A subscription says what the price buys, lasts at least a week, and works on all the user's devices"
corpus = ["apple.arg.3.1", "apple.arg.3.1.2"]
consumes = ["listing.text", "ios.built.references"]
kind = "judgement"
question = "The app offers a subscription. Before asking to subscribe, does it say plainly what the user gets for the price and how often? Is the period at least seven days? Does it keep giving value, work on every device the app runs on, and never take away what earlier buyers already paid for?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\bsubscri"]
severity = "fail"

[[rule]]
id = "apple.3.1.5.cryptocurrency"
store = "both"
title = "Cryptocurrency features stay within what Apple allows: no mining on device, licensed exchanges, organisation-enrolled wallets"
corpus = ["apple.arg.3.1.5", "google.blockchain-based-content"]
consumes = ["ios.built.references", "listing.text"]
kind = "judgement"
question = "The app touches cryptocurrency. Which of wallet, mining, exchange, ICO or task rewards does it do, and does each stay within the section's conditions? Name the evidence."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:crypto", "listing:\\b(crypto|bitcoin|ethereum|token|nft|wallet)"]
severity = "fail"

[[rule]]
id = "apple.3.2.2.no-forced-store-actions"
store = "both"
title = "Nothing is locked behind rating, reviewing, or installing other apps"
corpus = ["apple.arg.3.2.2", "google.user-ratings-reviews-and-installs"]
consumes = ["ios.built.info", "listing.text"]
kind = "judgement"
question = "From the app's strings and screens: is any feature, content or use gated on rating the app, writing a review, or installing another app? Asking for a rating without gating anything is fine."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.3.2.money-features-licensed"
store = "apple"
title = "Loans, trading, insurance, fundraising and gifts follow the business-model rules"
corpus = ["apple.arg.3.2.1", "apple.arg.3.2.2"]
consumes = ["listing.text"]
kind = "judgement"
question = "The listing mentions money features. Which of these does the app do: loans, trading or investing, insurance, charity fundraising, person-to-person gifts, tips? For each, does it meet the section's condition (licensed institution, APR at most 36% with full terms, approved nonprofit with Apple Pay, gift entirely to the recipient)?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(loan|apr\\b|trading|forex|cfd|invest|insurance|donat|fundrais|charity|gift)"]
severity = "fail"

[[rule]]
id = "apple.4.1.not-a-copycat"
store = "both"
title = "The name, icon and interface are the developer's own and impersonate nothing"
corpus = ["apple.arg.4.1", "google.impersonation", "google.misrepresentation"]
consumes = ["listing.text", "ios.built.info"]
kind = "judgement"
question = "Search the App Store for the app's name and close variants. Does another app or service use this name, icon or look? Does anything in the listing borrow another developer's brand? Record what was searched and what was found."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.4.2.more-than-a-website"
store = "both"
title = "The app offers real utility beyond a repackaged website and works without another app"
corpus = ["apple.arg.4.2", "google.functionality-content-and-user-experience", "google.spam"]
consumes = ["ios.built.references", "listing.text"]
kind = "judgement"
question = "Is the app more than a web page in a shell (a web view alone is the warning sign)? Does it work without installing another app? If it downloads a large resource at first launch, is the size disclosed and confirmed? Was it generated from a commercial template by someone other than the content owner?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.4.3.not-spam"
store = "both"
title = "One app, not many near-identical ones, and not a near-duplicate of a worn-out category"
corpus = ["apple.arg.4.3", "google.spam"]
consumes = ["listing.text"]
kind = "judgement"
question = "Does the developer ship other apps that are this app with a different city, team or skin? Is this a flashlight, timer, wallpaper, sound-effect, dating or fortune-telling app without a meaningful difference from what exists?"
stages = ["in-review", "public"]
severity = "risk"

[[rule]]
id = "apple.4.4.extensions-disclosed"
store = "apple"
title = "Bundled extensions are disclosed in the listing and carry no ads, marketing or purchases"
corpus = ["apple.arg.4.4"]
consumes = ["ios.built.info", "listing.text"]
kind = "judgement"
question = "The bundle contains app extensions. Does the marketing text say which extensions exist? Do they show no ads, marketing or in-app purchases? A keyboard extension must work without full access and offer a way to the next keyboard."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["extensions:any"]
severity = "fail"

[[rule]]
id = "apple.4.7.hosted-software"
store = "apple"
title = "Mini apps, streaming games, chatbots, plug-ins or emulator games the app offers follow the hosting rules"
corpus = ["apple.arg.4.7"]
consumes = ["listing.text", "ios.built.references"]
kind = "judgement"
question = "The listing suggests the app offers software it does not embed. Does that software get privacy compliance, moderation and in-app purchase; is no native API exposed to it; is no data or permission shared without per-instance consent; is there an index with universal links; is it age-gated?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(mini ?apps?|mini ?games?|streaming games?|chatbot|plug-?ins?|emulator)"]
severity = "fail"

[[rule]]
id = "apple.4.8.sign-in-with-apple-alongside-social-login"
store = "apple"
title = "A third-party social login is matched by Sign in with Apple"
corpus = ["apple.arg.4.8"]
consumes = ["ios.built.references"]
kind = "mechanical"
check = "sign_in_with_apple_offered"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:login", "signal:social-login"]
severity = "fail"

[[rule]]
id = "apple.4.9.apple-pay-disclosures"
store = "apple"
title = "Apple Pay shows all purchase information before the sale, and recurring terms in full"
corpus = ["apple.arg.4.9"]
consumes = ["ios.built.references", "listing.text"]
kind = "judgement"
question = "The executable uses Apple Pay. Before the payment sheet, are price, item and any recurring term, renewal, per-period content, actual charges and how to cancel all shown? Is the Apple Pay button and mark used as Apple's guidelines require?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:apple-pay"]
severity = "fail"

[[rule]]
id = "apple.4.10.no-selling-built-in-capabilities"
store = "apple"
title = "No paid feature is merely a built-in capability such as push, camera or gyroscope"
corpus = ["apple.arg.4.10"]
consumes = ["listing.text", "ios.built.references"]
kind = "judgement"
question = "The app sells something. Is any paid tier or purchase simply access to a device capability or an Apple service (notifications, camera, iCloud, Screen Time) rather than the developer's own feature?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:purchases", "listing:\\b(premium|subscri|unlock|pro version)"]
severity = "fail"

[[rule]]
id = "apple.5.1.3.health-data"
store = "apple"
title = "Health, fitness or motion data is used only for the user's benefit, disclosed, never sold, never in iCloud"
corpus = ["apple.arg.5.1.3"]
consumes = ["ios.built.references", "ios.built.info", "ios.built.privacy_manifests"]
kind = "judgement"
question = "The app reads health, fitness or motion data. Is the specific data named in the purpose string and privacy manifest? Is it used only to serve the user, with no advertising, marketing or third-party sharing? Is none of it stored in iCloud? If it runs research, is there informed consent and ethics approval?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["capability:health", "signal:healthkit"]
severity = "fail"

[[rule]]
id = "apple.5.1.4.no-child-appeal-outside-kids"
store = "apple"
title = "An app outside the Kids Category shows nothing that says children are its main audience"
corpus = ["apple.arg.5.1.4", "apple.arg.2.3"]
consumes = ["listing.text"]
kind = "judgement"
question = "The app is not in the Kids Category. Do the name, subtitle, icon, screenshots or description use words or imagery that imply children are the main audience? 'Family' branding with child-like imagery is the usual trap. Name what you looked at."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.5.2.only-owned-or-licensed-content"
store = "both"
title = "Everything in the app and its listing is the developer's own or licensed, and nothing suggests Apple's endorsement"
corpus = ["apple.arg.5.2", "google.intellectual-property"]
consumes = ["listing.text", "ios.built.info"]
kind = "judgement"
question = "Do the name, icon, screenshots, strings or bundled assets use anyone else's trademark, artwork, emoji or product likeness? Does the app pull content from a third-party service whose terms forbid it? Does any text imply Apple supplies or endorses the app? Name what you checked."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.5.3.gaming-gambling-lotteries"
store = "apple"
title = "Contests, gambling and lotteries are licensed, geo-restricted, free, and never funded by in-app purchase"
corpus = ["apple.arg.5.3"]
consumes = ["listing.text", "ios.built.references"]
kind = "judgement"
question = "The listing mentions betting, casino, lottery, sweepstakes or contest. Which is it? Are official rules shown in the app naming the developer as sponsor and Apple as uninvolved? For real-money play: licences in every territory, geo-restriction, free app, no in-app purchase for gaming credit?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(bet|betting|casino|poker|lottery|sweepstake|raffle|contest|gambl)"]
severity = "fail"

[[rule]]
id = "apple.5.4.vpn"
store = "apple"
title = "A VPN app uses NEVPNManager, declares data use on a screen first, and commits to sell nothing"
corpus = ["apple.arg.5.4"]
consumes = ["ios.built.references", "listing.privacy_policy_page", "ios.built.profile"]
kind = "judgement"
question = "The executable carries VPN code. Does it use NEVPNManager? Is the developer an organisation? Does a screen before any purchase or use say what data is collected and how it is used? Does the privacy policy commit to never selling, using or disclosing data to third parties? Are licence details in the review notes where required?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:vpn"]
severity = "fail"

[[rule]]
id = "apple.5.5.device-management"
store = "apple"
title = "Device-management features come with Apple's permission, an upfront data declaration and no data sales"
corpus = ["apple.arg.5.5"]
consumes = ["ios.built.references", "ios.built.profile"]
kind = "judgement"
question = "The app offers device management or configuration profiles. Was the MDM capability granted by Apple? Is the developer an eligible organisation? Is data use declared on a screen before purchase or use? Does the privacy policy commit to no sale or disclosure?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:device-management"]
severity = "fail"

[[rule]]
id = "apple.5.6.1.system-review-prompt-only"
store = "apple"
title = "Ratings are requested only through Apple's review prompt, never a custom one"
corpus = ["apple.arg.5.6"]
consumes = ["ios.built.references", "ios.built.info"]
kind = "judgement"
question = "Does the app ask for a rating or review? If so, does it use SKStoreReviewController or requestReview, and never a custom dialog or a gate that blocks use until rated? Cite the strings or code references you found."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "apple.5.6.no-manipulative-practices"
store = "apple"
title = "Nothing tricks people into purchases, unnecessary data sharing or undelivered features"
corpus = ["apple.arg.5.6"]
consumes = ["listing.text", "ios.built.info"]
kind = "judgement"
question = "From the listing and the app's strings: is anything designed to trick a purchase, force data the feature does not need, hide a price change, or charge for something not delivered? Is the developer identity in the listing truthful and current?"
stages = ["in-review", "public"]
severity = "fail"
