# Google Play Developer Program Policies, one record each. Where a policy asks
# the same question as an Apple section the rule in apple-guidelines.toml is
# marked store = "both" and cites both records; only Google-specific
# obligations live here.

[[rule]]
id = "google.child-safety-standards"
store = "google"
title = "A social, dating or stranger-chat app meets the Child Safety Standards"
corpus = ["google.child-endangerment"]
consumes = ["listing.text", "listing.privacy_policy_page"]
kind = "judgement"
question = "The app is social, dating, or connects strangers. Do published standards prohibit child sexual abuse and exploitation? Is there in-app reporting? Is there a process to remove such material and report it to the relevant authority? Is a child-safety contact named in Play Console?"
stages = ["internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(dating|match(making|es)?|random chat|anonymous|strangers|social network)"]
severity = "fail"

[[rule]]
id = "google.age-restricted-blocks-minors"
store = "google"
title = "Gambling, dating, stranger-chat or anonymous-chat apps block minors with Play Console tools"
corpus = ["google.age-restricted-content-and-functionality"]
consumes = ["listing.text", "console.google.declarations"]
kind = "judgement"
question = "The app's core is gambling, dating, random connection with strangers, or anonymous communication. Is Play Console's minor-blocking turned on for it? If dating is only incidental, is that feature age-gated?"
stages = ["internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(dating|match(making|es)?|random chat|anonymous|strangers|casino|bet|gambl|lottery)"]
severity = "fail"

[[rule]]
id = "google.ai-content-reporting"
store = "google"
title = "An app that generates content with AI lets users report offensive output in the app"
corpus = ["google.ai-generated-content"]
consumes = ["listing.text"]
kind = "judgement"
question = "Generating text, images or video from prompts is a central feature. Is there an in-app report or flag control on generated output? Does the app prevent restricted content such as child abuse material and deceptive content?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(ai[- ]generated|generative|chatbot|generate (images?|text|video)|gpt|llm)"]
severity = "fail"

[[rule]]
id = "google.financial-features-declared"
store = "google"
title = "An app with financial features files the Financial features declaration and meets the loan rules"
corpus = ["google.financial-services"]
consumes = ["listing.text", "console.google.declarations"]
kind = "judgement"
question = "The app has financial features. Is the Financial features declaration filed in Play Console? If it offers loans: Finance category, repayment period, maximum APR and representative cost in the listing, no loans due within 60 days, no US loans at 36% APR or more, no access to contacts or photos?"
stages = ["internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(loan|credit|invest|trading|bank|wallet|crypto|budget|payment|insurance|mortgage|wage)"]
severity = "fail"

[[rule]]
id = "google.no-real-money-prizes"
store = "google"
title = "Unless a licensed gambling operator, nothing lets users stake money for a prize of real value"
corpus = ["google.real-money-gambling-games-and-contests", "google.age-restricted-content-and-functionality"]
consumes = ["listing.text", "ios.built.references", "android.built.references"]
kind = "judgement"
question = "The listing mentions betting, prizes, tournaments or casino play. Can a user put money, or items bought with money, at stake for a prize of real value? If so, is the developer a licensed operator approved by Google, with minors and unlicensed regions blocked, a free app, no Play billing, an adults-only rating and responsible-gambling information?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(bet|betting|casino|poker|lottery|sweepstake|raffle|tournament|cash prize|win (money|cash)|gambl)"]
severity = "fail"

[[rule]]
id = "google.health-apps-declaration"
store = "google"
title = "A health-related app files the Health apps declaration and carries the not-a-medical-device disclaimer"
corpus = ["google.health-content-and-services"]
consumes = ["listing.text", "console.google.declarations", "android.built.references"]
kind = "judgement"
question = "The app has health-related features or reads health data. Is the Health apps declaration filed in Play Console? Does the description carry the disclaimer that it is not a medical device and does not diagnose, treat, cure or prevent any condition, and remind users to consult a professional? Are any hardware or sensor requirements disclosed? Is it a regulated medical device, and declared as such?"
stages = ["internal-beta", "in-review", "public"]
applies_when = ["capability:health", "signal:healthkit", "listing:\\b(health|medical|fitness|wellbeing|well-being|first aid|symptom|medication|blood|heart rate|sleep|diet|calorie|pregnan)"]
severity = "fail"

[[rule]]
id = "both.listing-describes-the-app"
store = "both"
title = "Title, icon, description and screenshots describe what the app really does, in this version"
corpus = ["apple.arg.2.3", "google.deceptive-behavior", "google.mobile-unwanted-software"]
consumes = ["listing.text", "ios.built.references", "android.built.references"]
kind = "judgement"
question = "Compare the listing to the facts: the capabilities and signals the binaries show, the features named. Does the listing claim a feature the app does not have, or hide one it has? Are the screenshots of this version? Is the category right? Name each mismatch."
stages = ["in-review", "public"]
severity = "fail"

[[rule]]
id = "both.no-fake-system-warnings"
store = "both"
title = "Nothing in the app imitates a system warning, another app, or a store interface"
corpus = ["google.deceptive-behavior", "apple.arg.5.2", "google.social-engineering", "google.unauthorized-use-or-imitation-of-system-functionality", "google.mobile-unwanted-software"]
consumes = ["ios.built.info", "listing.text"]
kind = "judgement"
question = "From the app's strings and screens: does any dialog, banner or notification look like an operating-system warning, a virus alert, a battery warning, or another app's interface? Name the strings you read."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.foreground-service-types-declared"
store = "google"
title = "Every foreground service type has its matching permission, and is declared in Play Console"
corpus = ["google.device-and-network-abuse"]
consumes = ["android.built.manifest", "console.google.declarations"]
kind = "mechanical"
check = "foreground_service_types"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.battery-optimisation-bypass-eligible"
store = "google"
title = "Asking to ignore battery optimisation is allowed only for apps whose core function breaks otherwise"
corpus = ["google.device-and-network-abuse"]
consumes = ["android.built.manifest"]
kind = "mechanical"
check = "battery_bypass"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "risk"

[[rule]]
id = "google.full-screen-intent-justified"
store = "google"
title = "The full-screen intent permission is used only for calls or alarms, never for notifications or ads"
corpus = ["google.device-and-network-abuse"]
consumes = ["android.built.manifest"]
kind = "mechanical"
check = "full_screen_intent"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "risk"

[[rule]]
id = "google.no-executable-download"
store = "google"
title = "The app updates itself only through Play and downloads no executable code"
corpus = ["google.device-and-network-abuse", "google.hostile-downloaders"]
consumes = ["android.built.references"]
kind = "judgement"
question = "Does anything in the compiled code load dex, JAR or native libraries from the network or from storage at run time (DexClassLoader, System.load from a downloaded path), or install APKs? Web content in a web view is allowed. Name what you looked for."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.restricted-permissions"
store = "google"
title = "Every restricted permission declared meets its own condition: default handler, review, declaration, or core purpose"
corpus = ["google.permissions-and-apis-that-access-sensitive-information"]
consumes = ["android.built.manifest", "listing.text"]
kind = "mechanical"
check = "restricted_permissions"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.contacts-picker-from-2027"
store = "google"
title = "From 27 January 2027, READ_CONTACTS needs a declaration that the Contact Picker is not enough"
corpus = ["google.preview-permissions-and-apis-that-access-sensitive-information"]
consumes = ["android.built.manifest", "console.google.declarations"]
kind = "mechanical"
check = "contacts_declaration"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["permission:android.permission.READ_CONTACTS"]
effective_from = "2027-01-27"
severity = "fail"

[[rule]]
id = "google.usable-when-permission-denied"
store = "google"
title = "The app stays usable when a person refuses a sensitive permission"
corpus = ["google.permissions-and-apis-that-access-sensitive-information"]
consumes = ["android.built.manifest"]
kind = "judgement"
question = "Deny each sensitive permission on a device. Does the app keep working with a reasonable alternative, or does it block, loop the prompt, or pressure the user? Name the permissions tried and what happened."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.monitoring-tool-flag"
store = "google"
title = "If the app declares itself a monitoring tool, it is parent-child or employer-employee only, with notification, icon and disclosure"
corpus = ["google.malware"]
consumes = ["android.built.manifest"]
kind = "mechanical"
check = "monitoring_flag"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.not-stalkerware"
store = "google"
title = "An app that lets one person see another's location or activity is not a monitoring app, or is a lawful one"
corpus = ["google.malware", "google.user-data"]
consumes = ["listing.text", "android.built.manifest", "android.built.references"]
kind = "judgement"
question = "The app shares location or activity between people. Who installs it, who controls the sharing, and can the person being seen stop it at any time and see that it is happening? If the watched person installs it on their own phone, chooses what to share and is told each time, it is not a monitoring app. If someone else installs it on their phone or the sharing cannot be seen or stopped by them, it is stalkerware unless exclusively for parents over children or employers over employees, marketed only as that, flagged IsMonitoringTool, with a persistent notification, a unique icon and the monitoring disclosed in the description. State which case and why, from the listing and the app's own screens."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["capability:location", "listing:\\b(track|monitor|locat|where (is|are)|find my|family|child|kid|employee|partner|spouse)"]
severity = "fail"

[[rule]]
id = "google.no-cleartext-traffic"
store = "google"
title = "Personal data does not travel over plain HTTP"
corpus = ["google.sdk-requirements", "google.mobile-unwanted-software"]
consumes = ["android.built.manifest"]
kind = "mechanical"
check = "cleartext_traffic"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "risk"

[[rule]]
id = "google.sdk-data-disclosed"
store = "google"
title = "What each bundled SDK collects is disclosed as the app's own, and no SDK sells data"
corpus = ["google.sdk-requirements", "google.data-safety"]
consumes = ["ios.built.privacy_manifests", "android.built.references", "console.google.data-safety"]
kind = "judgement"
question = "List the SDKs the binaries show. For each: what does it collect (the iOS privacy manifests say, for the ones that ship them), is that in the Data safety form, and do its terms forbid selling data? Name any SDK whose collection is not disclosed."
stages = ["internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "both.ads-behave"
store = "both"
title = "Ads fit the rating, are dismissible, stay inside the app, and never imitate the interface"
corpus = ["google.ads", "google.ad-fraud", "apple.arg.3.2.2"]
consumes = ["ios.built.references", "android.built.references", "listing.text"]
kind = "judgement"
question = "The binaries carry an ads SDK. Are ads appropriate for the app's content rating? Can every ad be dismissed without penalty? Do ads appear only inside the app, never on the home screen or on exit? Does no ad imitate the app's or the system's interface? Is there nothing that hides ads or fakes clicks?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:ads"]
severity = "fail"

[[rule]]
id = "both.notifications-only-for-the-apps-own-features"
store = "both"
title = "Notifications carry the app's own features, never ads or another app, and look like the app's"
corpus = ["apple.arg.4.5.4", "google.unauthorized-use-or-imitation-of-system-functionality"]
consumes = ["ios.built.info", "android.built.manifest", "listing.text"]
kind = "judgement"
question = "The app sends notifications. From the app's strings and the server code if available: is every notification about the app's own feature, attributed to the app, never promotional for another app or service, never styled as a system warning, and never required for the app to work?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["capability:notifications", "signal:push"]
severity = "fail"

[[rule]]
id = "google.play-billing-for-digital-goods"
store = "google"
title = "Digital purchases use Play billing, nothing steers users elsewhere, and prices match the Play bill"
corpus = ["google.payments"]
consumes = ["android.built.references", "listing.text"]
kind = "judgement"
question = "The app sells something. Are in-app features, content or subscriptions bought only through Play billing? Physical goods and the other exceptions must not use it. Does nothing in the listing, the app or its sign-up flow point to another payment method? Do in-app prices match the Play bill?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["signal:purchases", "listing:\\b(premium|subscri|unlock|pro version|in-app purchase|buy)"]
severity = "fail"

[[rule]]
id = "google.subscription-transparency"
store = "google"
title = "Subscription screens state cost, frequency, renewal and a way to continue without subscribing"
corpus = ["google.subscriptions"]
consumes = ["listing.text", "android.built.references"]
kind = "judgement"
question = "On the subscription screens: are cost, billing frequency, automatic renewal and whether a subscription is required all shown without extra taps? Is the annual price not disguised as a monthly one? Is there a visible way to continue without subscribing? Does the subscription give sustained value rather than a one-time benefit?"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["listing:\\bsubscri"]
severity = "fail"

[[rule]]
id = "google.listing-metadata-rules"
store = "google"
title = "Title, icon and developer name carry no emoji, shouting, ranking, price or programme claims, and no anonymous testimonials"
corpus = ["google.metadata", "google.app-promotion"]
consumes = ["listing.text"]
kind = "mechanical"
check = "google_metadata_rules"
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.content-rating-filed"
store = "google"
title = "An IARC content rating exists and matches the app's content"
corpus = ["google.content-ratings"]
consumes = ["console.google.declarations"]
kind = "mechanical"
check = "content_rating_filed"
stages = ["internal-beta", "in-review", "public"]
severity = "fail"

[[rule]]
id = "google.news-app-declaration"
store = "google"
title = "A news or magazine app declares itself and names sources, contact and preview"
corpus = ["google.news-and-magazines"]
consumes = ["listing.text", "console.google.declarations"]
kind = "judgement"
question = "The listing describes a news or magazine app. Is the self-declaration filed in Play Console? Is every article's publisher or author shown? Is contact information easy to find? Is there an in-app preview before subscribing?"
stages = ["internal-beta", "in-review", "public"]
applies_when = ["listing:\\b(news|magazine|journal|headlines)"]
severity = "fail"

[[rule]]
id = "google.no-messages-without-confirmation"
store = "google"
title = "The app never sends a message on the user's behalf without showing content and recipients first"
corpus = ["google.spam"]
consumes = ["android.built.manifest", "android.built.references"]
kind = "judgement"
question = "Does the app send SMS, email or other messages for the user (a share, an invite, an alert)? If so, does the user see the content and the recipients and confirm before it goes? Name the flow."
stages = ["built-not-uploaded", "internal-beta", "in-review", "public"]
applies_when = ["permission:android.permission.SEND_SMS", "listing:\\b(invite|share|send (a )?message|sms)"]
severity = "fail"
