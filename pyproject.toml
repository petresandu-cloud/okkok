[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storecheck"
version = "0.1.0"
description = "Does this app meet the App Store and Google Play rules, and how do we know? Reads the built app, never the source."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Petre Sandu"}]
keywords = ["app-store", "google-play", "compliance", "app-review", "ios", "android", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.urls]
Homepage = "https://github.com/petresandu-cloud/storecheck"
Issues = "https://github.com/petresandu-cloud/storecheck/issues"

[project.scripts]
storecheck = "storecheck.cli:main"

[tool.setuptools.packages.find]
include = ["storecheck*"]

[tool.setuptools.package-data]
storecheck = ["rules/*.toml", "data/*.txt", "corpus/*/*.json", "crosswalk/*.json"]
