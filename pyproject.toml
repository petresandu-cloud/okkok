[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storecheck"
version = "0.1.0"
description = "Okkok: OK for the App Store, OK for Google Play. Audits the built app against both stores' rules, never the source."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
requires-python = ">=3.11"
authors = [{name = "Editerra AB"}]
keywords = ["app-store", "google-play", "compliance", "app-review", "ios", "android", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.urls]
Homepage = "https://github.com/petresandu-cloud/storecheck"
Issues = "https://github.com/petresandu-cloud/storecheck/issues"

[project.scripts]
storecheck = "storecheck.cli:main"

[tool.setuptools.packages.find]
include = ["storecheck*"]

[tool.setuptools.package-data]
storecheck = ["rules/*.toml", "data/*.txt", "corpus/*/*.json", "crosswalk/*.json"]
